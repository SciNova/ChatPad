<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="/styles.css?v={{ asset_version('styles.css') }}">
	<script src="/diff_match_patch.js"></script>
	<script src="/lucide.js"></script>
	<script src="/handlebars.js"></script>
	<script src="/chatpad.js?v={{ asset_version('chatpad.js') }}"></script>
	<title></title>
</head>
<body>

<nav>
	<a href="/" class="{{ 'active' if request.path == '/' or request.path == '/chat' else '' }}">Main</a>
	<a href="/sessions" class="{{ 'active' if request.path.startswith('/sessions') or request.path.startswith('/archive') or request.path.startswith('/chat/') else '' }}">Sessions</a>
	<a href="/models" class="{{ 'active' if request.path == '/models' else '' }}">Models</a>
</nav>
{% block topbar %}{% endblock %}

	<main>
		{% block content %}{% endblock %}
	</main>
</body>
</html>
